<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Planet Generator</title>
  <style>
    :root { --bg:#0d1119;--panel:#18202d;--ink:#e9f0fa;--muted:#94a5bc;--cyan:#62d6ff;--line:#334157;--danger:#ff8d8d;--success:#79e2a7 }
    * { box-sizing:border-box } body { margin:0;color:var(--ink);background:radial-gradient(circle at 70% -20%,#1b3453 0,transparent 38%),var(--bg);font:14px "Microsoft YaHei UI","Segoe UI",sans-serif }
    main { max-width:1240px;margin:auto;padding:28px 32px 48px }.topbar { display:flex;align-items:flex-start;justify-content:space-between;gap:20px } h1 { margin:0;font-size:28px }.subtitle { margin:5px 0 22px;color:var(--muted) }.language-control { display:flex;align-items:center;gap:9px }.language-control label { min-width:0;color:var(--muted) }.language-control select { width:auto;min-width:120px }
    .tabs { display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:20px }.tab { border:0;border-radius:9px 9px 0 0;padding:12px 28px;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-size:15px }.tab.active { color:var(--cyan);background:var(--panel) }
    .page { display:none;grid-template-columns:minmax(540px,3fr) minmax(320px,2fr);gap:18px;align-items:start }.page.active { display:grid }.card { background:var(--panel);border:1px solid #263247;border-radius:13px;padding:22px;box-shadow:0 16px 50px #0003 }.card h2 { margin:0 0 3px;font-size:20px }.hint { margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.55 }
    .section { padding:16px 0;border-top:1px solid var(--line) }.section:first-of-type { border-top:0;padding-top:0 }.section h3 { margin:0 0 12px;color:var(--cyan);font-size:14px }.grid { display:grid;grid-template-columns:1fr 1fr;gap:10px 18px }.row { display:flex;align-items:center;gap:10px;min-height:34px }
    label { color:#d4ddec;min-width:112px } input,select { min-width:0;width:100%;color:var(--ink);background:#0d121c;border:1px solid #3a4860;border-radius:7px;padding:7px 9px;font:inherit } input:focus,select:focus { outline:2px solid #62d6ff55;border-color:var(--cyan) } input[type="color"] { width:38px;height:30px;padding:2px;cursor:pointer } input[type="checkbox"],input[type="radio"] { width:auto;accent-color:var(--cyan) }
    .toggle { display:flex;align-items:center;gap:8px;color:var(--ink);cursor:pointer }.toggle label { min-width:0;cursor:pointer }.hidden { display:none!important }.options { margin:10px 0 0 28px;padding:12px;background:#111925;border-radius:8px }.color-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px }.color-row { display:flex;align-items:center;gap:8px;color:var(--muted) }.color-row span { min-width:74px }.seed-choices { display:flex;align-items:center;gap:18px;flex-wrap:wrap }.seed-choices label { min-width:0 }.path-row { display:grid;grid-template-columns:112px minmax(0,1fr) auto auto;align-items:center;gap:10px }.path-display { color:#7f8da2;background:#111722;pointer-events:none;user-select:none }.path-button { border:1px solid #43536c;border-radius:7px;padding:7px 11px;background:#202b3c;color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap }.path-button:hover { border-color:var(--cyan) }.path-button.secondary { color:var(--muted);background:transparent }
    .button { margin-top:4px;width:100%;border:0;border-radius:8px;padding:12px 14px;background:var(--cyan);color:#06202b;font-weight:800;cursor:pointer;font:inherit }.button:hover { filter:brightness(1.08) }.button:disabled { cursor:wait;opacity:.55 }.status { min-height:20px;margin:12px 0 0;text-align:center;color:var(--muted);font-size:13px }.status.error { color:var(--danger) }.status.success { color:var(--success) }
    .preview { position:sticky;top:18px;display:flex;flex-direction:column }.scene { position:relative;height:340px;overflow:hidden;display:grid;place-items:center;border-radius:10px;background-color:#07111e;background-image:radial-gradient(#fff9 1px,transparent 1.5px),radial-gradient(#83cfff8c 1px,transparent 1.5px);background-size:37px 41px,73px 67px;background-position:0 0,11px 19px }.generated-preview { position:relative;z-index:1;width:100%;height:100%;padding:12px;object-fit:contain;image-rendering:pixelated }.placeholder { position:relative;z-index:1;color:var(--muted);text-align:center;line-height:1.7 }.preview h2 { margin:20px 0 4px }.preview p { color:var(--muted);line-height:1.55 }.output { margin-top:12px;min-height:44px;border:1px dashed #41536f;border-radius:8px;padding:10px 12px;color:var(--muted);font-size:12px;overflow-wrap:anywhere }.output strong { display:block;margin-bottom:3px;color:#c8d7e9 }
    @media(max-width:900px){main{padding:20px 14px 36px}.page.active{grid-template-columns:1fr}.preview{position:static}} @media(max-width:600px){.topbar{flex-direction:column}.grid,.color-grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column;gap:5px}label{min-width:0}.path-row{grid-template-columns:1fr 1fr}.path-row label,.path-display{grid-column:1/-1}}
  </style>
</head>
<body><main>
  <header class="topbar"><div><h1>Pixel Planet Generator</h1><p class="subtitle" id="service-state" data-i18n="service.connecting"></p></div><div class="language-control"><label for="language-select" data-i18n="language.label"></label><select id="language-select"><option value="zh-CN" data-i18n="language.zh_cn"></option><option value="en-US" data-i18n="language.en_us"></option></select></div></header>
  <nav class="tabs"><button class="tab active" data-page="planet-page" data-i18n="tab.planet"></button><button class="tab" data-page="galaxy-page" data-i18n="tab.galaxy"></button></nav>

  <section class="page active" id="planet-page"><div class="card">
    <h2 data-i18n="planet.form_title"></h2><p class="hint" id="planet-form-hint" data-i18n="planet.form_hint"></p>
    <div class="section"><h3 data-i18n="section.basic"></h3><div class="grid">
      <div class="row"><label for="tone" data-i18n="planet.style"></label><select id="tone"><option value="earth" data-i18n="planet.style_earth"></option><option value="desert" data-i18n="planet.style_desert"></option><option value="lava" data-i18n="planet.style_lava"></option><option value="toxic" data-i18n="planet.style_toxic"></option><option value="ice" data-i18n="planet.style_ice"></option><option value="ocean" data-i18n="planet.style_ocean"></option><option value="alien" data-i18n="planet.style_alien"></option><option value="forest" data-i18n="planet.style_forest"></option><option value="gas" data-i18n="planet.style_gas"></option><option value="mono" data-i18n="planet.style_mono"></option><option value="custom" data-i18n="planet.custom"></option></select></div>
      <div class="row"><label for="planet-size" data-i18n="planet.base_size"></label><input id="planet-size" type="number" min="16" max="512" value="96"></div><div class="row"><label for="planet-scale" data-i18n="planet.scale"></label><input id="planet-scale" type="number" min="1" max="12" value="4"></div>
    </div><div class="options hidden" id="planet-custom"><strong data-i18n="planet.custom_title"></strong><p class="hint" data-i18n="planet.custom_hint"></p><div class="color-grid">
      <div class="color-row"><span data-i18n="color.sea_dark"></span><input id="planet-sea-1" type="color" value="#102A43"></div><div class="color-row"><span data-i18n="color.sea_light"></span><input id="planet-sea-2" type="color" value="#2B6CB0"></div><div class="color-row"><span data-i18n="color.land_dark"></span><input id="planet-land-1" type="color" value="#22543D"></div><div class="color-row"><span data-i18n="color.land_mid"></span><input id="planet-land-2" type="color" value="#68D391"></div><div class="color-row"><span data-i18n="color.land_light"></span><input id="planet-land-3" type="color" value="#F6E05E"></div><div class="color-row"><span data-i18n="color.ring"></span><input id="planet-custom-ring" type="color" value="#F6AD55"></div>
    </div></div></div>
    <div class="section"><h3 data-i18n="section.decoration"></h3><div class="toggle"><input id="ring" type="checkbox"><label for="ring" data-i18n="planet.ring_enable"></label></div><div class="options hidden" id="ring-options"><div class="grid"><div class="row"><label for="ring-color" data-i18n="color.ring"></label><input id="ring-color" type="color" value="#00FFFF"></div><div class="row"><label for="ring-tilt" data-i18n="planet.ring_tilt"></label><input id="ring-tilt" type="number" step="0.01" min="0.01" max="1" value="0.42"></div><div class="row"><label for="ring-width" data-i18n="planet.ring_width"></label><input id="ring-width" type="number" step="0.01" min="0.01" max="1.74" value="0.28"></div></div></div>
      <div class="toggle" style="margin-top:12px"><input id="frame" type="checkbox"><label for="frame" data-i18n="planet.frame_enable"></label></div><div class="options hidden" id="frame-options"><div class="grid"><div class="row"><label for="frame-color" data-i18n="planet.frame_color"></label><input id="frame-color" type="color" value="#00FFFF"></div><div class="row"><label for="frame-size" data-i18n="planet.frame_size"></label><input id="frame-size" type="number" min="1" value="12"></div><div class="row"><label for="frame-thickness" data-i18n="planet.frame_thickness"></label><input id="frame-thickness" type="number" min="1" value="2"></div><div class="row"><label for="frame-padding" data-i18n="planet.frame_padding"></label><input id="frame-padding" type="number" min="0" value="4"></div></div></div>
    </div>
    <div class="section"><h3 id="planet-random-title" data-i18n="section.random_animation"></h3><div class="seed-choices"><label><input type="radio" name="planet-seed" value="auto" checked> <span data-i18n="seed.auto"></span></label><label><input type="radio" name="planet-seed" value="manual"> <span data-i18n="seed.manual"></span></label><input id="planet-seed-value" class="hidden" type="number" value="12345"></div><p class="hint hidden" id="planet-simple-hint" data-i18n="seed.simple_hint"></p><div class="toggle" id="planet-unique-row" style="margin-top:10px"><input id="planet-unique" type="checkbox"><label for="planet-unique" data-i18n="seed.unique"></label></div><div class="toggle" id="planet-animation-row" style="margin-top:14px"><input id="planet-animation" type="checkbox"><label for="planet-animation" data-i18n="animation.enable"></label></div><div class="options hidden" id="planet-animation-options"><div class="grid"><div class="row"><label for="planet-frames" data-i18n="animation.frames"></label><input id="planet-frames" type="number" min="15" max="60" value="24"></div><div class="row"><label for="planet-prefix" data-i18n="animation.prefix"></label><input id="planet-prefix" data-i18n-placeholder="animation.prefix_placeholder"></div></div></div></div>
    <div class="section"><h3 data-i18n="section.output"></h3><div class="path-row"><label id="planet-output-label" for="planet-output" data-i18n="output.directory"></label><input class="path-display" id="planet-output" readonly tabindex="-1"><button class="path-button" id="planet-select-output" data-i18n="output.select"></button><button class="path-button secondary" id="planet-reset-output" data-i18n="output.reset"></button></div></div>
  </div><aside class="card preview"><div class="scene"><div class="placeholder" id="planet-placeholder" data-i18n="planet.preview_placeholder"></div><img class="generated-preview hidden" id="planet-preview" data-i18n-alt="planet.preview_alt"></div><h2 data-i18n="planet.preview_title"></h2><p id="planet-preview-hint" data-i18n="planet.preview_hint"></p><button class="button" id="planet-generate" data-i18n="planet.generate"></button><div class="status" id="planet-status"></div><div class="output" id="planet-result"><strong data-i18n="output.location"></strong><span data-i18n="output.not_generated"></span></div></aside></section>

  <section class="page" id="galaxy-page"><div class="card">
    <h2 data-i18n="galaxy.form_title"></h2><p class="hint" id="galaxy-form-hint" data-i18n="galaxy.form_hint"></p>
    <div class="section"><h3 data-i18n="section.basic"></h3><div class="grid"><div class="row"><label for="theme" data-i18n="galaxy.theme"></label><select id="theme"><option value="deep_blue" data-i18n="galaxy.theme_deep_blue"></option><option value="red_nebula" data-i18n="galaxy.theme_red_nebula"></option><option value="white_bright" data-i18n="galaxy.theme_white_bright"></option><option value="purple_magenta" data-i18n="galaxy.theme_purple_magenta"></option><option value="cold_white" data-i18n="galaxy.theme_cold_white"></option><option value="custom" data-i18n="planet.custom"></option></select></div><div class="row"><label for="galaxy-width" data-i18n="galaxy.width"></label><input id="galaxy-width" type="number" min="64" max="4096" value="800"></div><div class="row"><label for="galaxy-height" data-i18n="galaxy.height"></label><input id="galaxy-height" type="number" min="64" max="4096" value="450"></div><div class="row"><label for="pixel-size" data-i18n="galaxy.pixel_size"></label><input id="pixel-size" type="number" min="1" max="12" value="3"></div></div>
      <div class="options hidden" id="galaxy-custom"><strong data-i18n="galaxy.custom_title"></strong><p class="hint" data-i18n="galaxy.custom_hint"></p><div class="color-grid"><div class="color-row"><span data-i18n="color.background_top"></span><input id="bg-top" type="color" value="#10002B"></div><div class="color-row"><span data-i18n="color.background_bottom"></span><input id="bg-bottom" type="color" value="#240046"></div><div class="color-row"><span data-i18n="color.nebula_1"></span><input id="nebula-1" type="color" value="#5A189A"></div><div class="color-row"><span data-i18n="color.nebula_2"></span><input id="nebula-2" type="color" value="#9D4EDD"></div><div class="color-row"><span data-i18n="color.nebula_3"></span><input id="nebula-3" type="color" value="#E0AAFF"></div><div class="color-row"><span data-i18n="color.galaxy_1"></span><input id="galaxy-1" type="color" value="#C77DFF"></div><div class="color-row"><span data-i18n="color.galaxy_2"></span><input id="galaxy-2" type="color" value="#F8F9FA"></div><div class="color-row"><span data-i18n="color.galaxy_3"></span><input id="galaxy-3" type="color" value="#FFFFFF"></div></div></div>
    </div>
    <div class="section"><h3 data-i18n="section.effects"></h3><div class="grid"><div class="row"><label for="seamless-axis" data-i18n="galaxy.seamless"></label><select id="seamless-axis"><option value="" data-i18n="galaxy.seamless_none"></option><option value="horizontal" data-i18n="galaxy.seamless_horizontal"></option><option value="vertical" data-i18n="galaxy.seamless_vertical"></option></select></div><div class="row"><label for="flash-stars" data-i18n="galaxy.flash_stars"></label><input id="flash-stars" type="number" min="0" max="50" value="15"></div></div></div>
    <div class="section"><h3 id="galaxy-random-title" data-i18n="section.random_animation"></h3><div class="seed-choices"><label><input type="radio" name="galaxy-seed" value="auto" checked> <span data-i18n="seed.auto"></span></label><label><input type="radio" name="galaxy-seed" value="manual"> <span data-i18n="seed.manual"></span></label><input id="galaxy-seed-value" class="hidden" type="number" value="12345"></div><p class="hint hidden" id="galaxy-simple-hint" data-i18n="seed.simple_hint"></p><div class="toggle" id="galaxy-unique-row" style="margin-top:10px"><input id="galaxy-unique" type="checkbox"><label for="galaxy-unique" data-i18n="seed.unique"></label></div><div class="toggle" id="galaxy-animation-row" style="margin-top:14px"><input id="galaxy-animation" type="checkbox"><label for="galaxy-animation" data-i18n="animation.enable"></label></div><div class="options hidden" id="galaxy-animation-options"><div class="grid"><div class="row"><label for="galaxy-frames" data-i18n="animation.frames"></label><input id="galaxy-frames" type="number" min="15" max="60" value="24"></div><div class="row"><label for="galaxy-prefix" data-i18n="animation.prefix"></label><input id="galaxy-prefix" data-i18n-placeholder="animation.prefix_placeholder"></div></div></div></div>
    <div class="section"><h3 data-i18n="section.output"></h3><div class="path-row"><label id="galaxy-output-label" for="galaxy-output" data-i18n="output.directory"></label><input class="path-display" id="galaxy-output" readonly tabindex="-1"><button class="path-button" id="galaxy-select-output" data-i18n="output.select"></button><button class="path-button secondary" id="galaxy-reset-output" data-i18n="output.reset"></button></div></div>
  </div><aside class="card preview"><div class="scene"><div class="placeholder" id="galaxy-placeholder" data-i18n="galaxy.preview_placeholder"></div><img class="generated-preview hidden" id="galaxy-preview" data-i18n-alt="galaxy.preview_alt"></div><h2 data-i18n="galaxy.preview_title"></h2><p id="galaxy-preview-hint" data-i18n="galaxy.preview_hint"></p><button class="button" id="galaxy-generate" data-i18n="galaxy.generate"></button><div class="status" id="galaxy-status"></div><div class="output" id="galaxy-result"><strong data-i18n="output.location"></strong><span data-i18n="output.not_generated"></span></div></aside></section>
</main>
<script>
  const byId=id=>document.getElementById(id),intValue=id=>Number.parseInt(byId(id).value,10),floatValue=id=>Number.parseFloat(byId(id).value),timers={};
  let messages={},outputSettings={},serviceOnline=false,activeLanguage='zh-CN',activeEdition='full';
  const text=key=>messages[key]||key;
  const loadAvailableLanguages=async()=>{try{const response=await fetch('/api/locales'),result=await response.json();if(!response.ok||!result.ok||!result.locales.length)return;const select=byId('language-select');select.textContent='';result.locales.forEach(locale=>{const option=document.createElement('option');option.value=locale.code;option.textContent=locale.name;select.append(option)})}catch(error){}};
  const format=(key,values)=>Object.entries(values).reduce((result,entry)=>result.replaceAll('{'+entry[0]+'}',entry[1]),text(key));
  const applyTranslations=()=>{document.querySelectorAll('[data-i18n]').forEach(element=>element.textContent=text(element.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(element=>element.placeholder=text(element.dataset.i18nPlaceholder));document.querySelectorAll('[data-i18n-alt]').forEach(element=>element.alt=text(element.dataset.i18nAlt))};
  const updateServiceText=()=>{const key=serviceOnline?(activeEdition==='simple'?'service.connected_simple':'service.connected'):'service.disconnected';byId('service-state').textContent=text(key);byId('service-state').style.color=serviceOnline?'':'var(--danger)'};
  const loadLanguage=async(language,persist=false)=>{if(!/^[A-Za-z0-9-]+$/.test(language))language='zh-CN';let response=await fetch('/locales/'+language+'.json');if(!response.ok&&language!=='zh-CN'){language='zh-CN';response=await fetch('/locales/zh-CN.json')}if(!response.ok)throw new Error();messages=await response.json();activeLanguage=language;document.documentElement.lang=language;byId('language-select').value=language;applyTranslations();refreshOutputPath('planet');refreshOutputPath('galaxy');updateServiceText();if(persist){try{localStorage.setItem('pixel-planet-language',language)}catch(error){}}};
  const bindToggle=(trigger,target)=>byId(trigger).addEventListener('change',event=>byId(target).classList.toggle('hidden',!event.target.checked));
  const selectedSeed=kind=>document.querySelector('input[name="'+kind+'-seed"]:checked').value==='manual'?intValue(kind+'-seed-value'):null;
  const selectedStyle=kind=>kind==='planet'?(byId('tone').value==='custom'?'custom':byId('tone').value):(byId('theme').value==='custom'?'custom':byId('theme').value);
  const settingKey=kind=>kind+'_'+(byId(kind+'-animation').checked?'animation':'static');
  const defaultPath=kind=>{const style=selectedStyle(kind),seed=selectedSeed(kind)??text('path.seed_token'),animation=byId(kind+'-animation').checked,folder=animation?kind+'_animation':kind;return 'output/'+folder+'/'+style+'-'+seed+'/'};
  const refreshOutputPath=kind=>{const key=settingKey(kind),custom=outputSettings[key],input=byId(kind+'-output'),label=byId(kind+'-output-label');input.value=custom||defaultPath(kind);input.dataset.custom=custom?'true':'false';label.dataset.i18n='output.directory';label.textContent=text(label.dataset.i18n);byId(kind+'-reset-output').disabled=!custom};
  const requestJson=async(url,options={})=>{const response=await fetch(url,options),result=await response.json();if(!response.ok||!result.ok)throw new Error();return result};
  const applyEdition=edition=>{activeEdition=edition||'full';if(activeEdition!=='simple')return;['planet','galaxy'].forEach(kind=>{const select=byId(kind==='planet'?'tone':'theme'),custom=select.querySelector('option[value="custom"]');if(custom)custom.remove();byId(kind+'-animation').checked=false;byId(kind+'-animation-row').classList.add('hidden');byId(kind+'-animation-options').classList.add('hidden');byId(kind+'-unique').checked=false;byId(kind+'-unique-row').classList.add('hidden');byId(kind+'-simple-hint').classList.remove('hidden');const seedInput=byId(kind+'-seed-value');seedInput.min='0';seedInput.max='49';seedInput.value='0';const keys={planet:['planet.form_hint_simple','planet.preview_hint_simple'],galaxy:['galaxy.form_hint_simple','galaxy.preview_hint_simple']};byId(kind+'-form-hint').dataset.i18n=keys[kind][0];byId(kind+'-preview-hint').dataset.i18n=keys[kind][1];byId(kind+'-random-title').dataset.i18n='section.random';refreshOutputPath(kind)});applyTranslations();updateServiceText()};
  const chooseOutput=async kind=>{const animation=byId(kind+'-animation').checked,status=byId(kind+'-status'),button=byId(kind+'-select-output');button.disabled=true;status.className='status';status.textContent=text('status.selecting');try{const result=await requestJson('/api/select-output',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,animation})});outputSettings=result.outputs||outputSettings;refreshOutputPath(kind);status.textContent=''}catch(error){status.className='status error';status.textContent=text('status.failed')}finally{button.disabled=false}};
  const resetOutput=async kind=>{const animation=byId(kind+'-animation').checked,status=byId(kind+'-status');try{const result=await requestJson('/api/reset-output',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,animation})});outputSettings=result.outputs||{};refreshOutputPath(kind);status.textContent='';status.className='status'}catch(error){status.className='status error';status.textContent=text('status.failed')}};
  document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab,.page').forEach(element=>element.classList.remove('active'));tab.classList.add('active');byId(tab.dataset.page).classList.add('active')}));
  byId('tone').addEventListener('change',event=>{byId('planet-custom').classList.toggle('hidden',event.target.value!=='custom');refreshOutputPath('planet')});byId('theme').addEventListener('change',event=>{byId('galaxy-custom').classList.toggle('hidden',event.target.value!=='custom');refreshOutputPath('galaxy')});
  bindToggle('ring','ring-options');bindToggle('frame','frame-options');bindToggle('planet-animation','planet-animation-options');bindToggle('galaxy-animation','galaxy-animation-options');
  ['planet','galaxy'].forEach(kind=>{document.querySelectorAll('input[name="'+kind+'-seed"]').forEach(radio=>radio.addEventListener('change',()=>{byId(kind+'-seed-value').classList.toggle('hidden',document.querySelector('input[name="'+kind+'-seed"]:checked').value!=='manual');refreshOutputPath(kind)}));byId(kind+'-seed-value').addEventListener('input',()=>refreshOutputPath(kind));byId(kind+'-animation').addEventListener('change',()=>refreshOutputPath(kind));byId(kind+'-select-output').addEventListener('click',()=>chooseOutput(kind));byId(kind+'-reset-output').addEventListener('click',()=>resetOutput(kind))});
  byId('language-select').addEventListener('change',event=>loadLanguage(event.target.value,true));
  const showPreview=(kind,urls)=>{clearInterval(timers[kind]);const image=byId(kind+'-preview');byId(kind+'-placeholder').classList.add('hidden');image.classList.remove('hidden');let index=0;image.src=urls[0];if(urls.length>1)timers[kind]=setInterval(()=>{index=(index+1)%urls.length;image.src=urls[index]},120)};
  const generate=async(kind,payload)=>{const button=byId(kind+'-generate'),status=byId(kind+'-status');button.disabled=true;status.className='status';status.textContent=text('status.generating');try{const result=await requestJson('/api/generate/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});showPreview(kind,result.frame_urls);status.className='status success';status.textContent=result.frame_count>1?format('status.complete_animation',{seed:result.seed,count:result.frame_count}):format('status.complete',{seed:result.seed});const output=byId(kind+'-result');output.textContent='';const strong=document.createElement('strong');strong.textContent=text('output.location');output.append(strong,document.createTextNode(result.output));refreshOutputPath(kind)}catch(error){status.className='status error';status.textContent=text('status.failed')}finally{button.disabled=false}};
  byId('planet-generate').addEventListener('click',()=>generate('planet',{tone:byId('tone').value,size:intValue('planet-size'),scale:intValue('planet-scale'),seed:selectedSeed('planet'),ensure_unique:byId('planet-unique').checked,ring:byId('ring').checked,ring_color:byId('ring-color').value,ring_tilt:floatValue('ring-tilt'),ring_width:floatValue('ring-width'),frame:byId('frame').checked,frame_color:byId('frame-color').value,frame_size:intValue('frame-size'),frame_thickness:intValue('frame-thickness'),frame_padding:intValue('frame-padding'),animation:byId('planet-animation').checked,frames:intValue('planet-frames'),use_saved_output:Boolean(outputSettings[settingKey('planet')]),filename_prefix:byId('planet-prefix').value,custom_palette:{sea:[byId('planet-sea-1').value,byId('planet-sea-2').value],land:[byId('planet-land-1').value,byId('planet-land-2').value,byId('planet-land-3').value],ringcolor:byId('planet-custom-ring').value}}));
  byId('galaxy-generate').addEventListener('click',()=>generate('galaxy',{theme_name:byId('theme').value,width:intValue('galaxy-width'),height:intValue('galaxy-height'),pixel_size:intValue('pixel-size'),seamless_axis:byId('seamless-axis').value||null,flash_stars:intValue('flash-stars'),seed:selectedSeed('galaxy'),ensure_unique:byId('galaxy-unique').checked,animation:byId('galaxy-animation').checked,frames:intValue('galaxy-frames'),use_saved_output:Boolean(outputSettings[settingKey('galaxy')]),filename_prefix:byId('galaxy-prefix').value,custom_theme:{name:'custom',bg_top:byId('bg-top').value,bg_bottom:byId('bg-bottom').value,nebula:[byId('nebula-1').value,byId('nebula-2').value,byId('nebula-3').value],galaxy:[byId('galaxy-1').value,byId('galaxy-2').value,byId('galaxy-3').value]}}));
  const initialize=async()=>{await loadAvailableLanguages();let preferred=new URLSearchParams(location.search).get('lang');if(!preferred){try{preferred=localStorage.getItem('pixel-planet-language')}catch(error){}}await loadLanguage(preferred||'zh-CN');try{const settings=await requestJson('/api/settings');outputSettings=settings.outputs||{}}catch(error){outputSettings={}}refreshOutputPath('planet');refreshOutputPath('galaxy');try{const response=await fetch('/api/health');serviceOnline=response.ok;if(response.ok){const info=await response.json();applyEdition(info.edition)}}catch(error){serviceOnline=false}updateServiceText()};
  initialize().catch(()=>{document.documentElement.lang='zh-CN'});
</script></body></html>
