<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pixel Art Planet Generator</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Pixel Art Planet Generator</h1>
      <p data-i18n="app.subtitle"></p>
    </div>
    <div class="header-actions">
      <label class="compact"><span data-i18n="language.label"></span>
        <select id="language-select"><option value="zh-CN">简体中文</option><option value="en-US">English</option></select>
      </label>
      <a class="secondary nav-link" href="guide.html" data-i18n="guide.open"></a>
    </div>
  </header>

  <main>
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" data-panel="planet-panel" data-i18n="planet.tab"></button>
      <button class="tab" role="tab" data-panel="galaxy-panel" data-i18n="galaxy.tab"></button>
    </div>

    <section id="planet-panel" class="generator-panel active">
      <form id="planet-form" class="controls">
        <h2 data-i18n="planet.heading"></h2>
        <label><span data-i18n="common.mode"></span><select name="mode"><option value="static" data-i18n="mode.static"></option><option value="animation" data-i18n="mode.animation"></option></select></label>
        <label><span data-i18n="planet.style"></span><select name="style" id="planet-style"></select></label>
        <label><span data-i18n="planet.oceanRatio"></span><select name="ocean-ratio"><option value="30">30%</option><option value="40">40%</option><option value="50">50%</option><option value="60" selected>60%</option><option value="70">70%</option><option value="80">80%</option><option value="90">90%</option></select></label>
        <div class="two-columns">
          <label><span data-i18n="common.size"></span><input name="size" type="number" min="48" max="192" step="8" value="96"></label>
          <label><span data-i18n="common.scale"></span><input name="scale" type="number" min="1" max="8" value="4"></label>
        </div>
        <fieldset class="seed-settings">
          <legend data-i18n="seed.heading"></legend>
          <label><span data-i18n="seed.source"></span><select name="seed-source"><option value="random" data-i18n="seed.random"></option><option value="input" data-i18n="seed.input"></option></select></label>
          <div class="seed-input-options" hidden>
            <label><span data-i18n="seed.policy"></span><select name="seed-policy"><option value="reproduce" data-i18n="seed.reproduce"></option><option value="avoid" data-i18n="seed.avoid"></option></select></label>
            <label><span data-i18n="seed.values"></span><input name="seeds" type="text" inputmode="numeric" data-i18n-placeholder="seed.placeholder"></label>
            <div class="seed-scan-options" hidden>
              <label class="check"><input name="scan-existing" type="checkbox"><span data-i18n="seed.scanExisting"></span></label>
              <div class="seed-folder-controls" hidden>
                <button name="choose-seed-folder" class="secondary" type="button" data-i18n="seed.chooseScanFolder"></button>
                <output class="seed-scan-status" data-i18n="seed.scanDefault"></output>
                <p class="seed-scan-help" data-i18n="seed.scanHelp"></p>
              </div>
            </div>
          </div>
        </fieldset>
        <label class="check"><input name="ring" type="checkbox" checked><span data-i18n="planet.ring"></span></label>
        <label class="check"><input name="frame" type="checkbox"><span data-i18n="planet.frame"></span></label>
        <label id="planet-frame-states-option" class="check" hidden><input name="frame-states" type="checkbox"><span data-i18n="planet.frameStates"></span></label>
        <label class="animation-only"><span data-i18n="common.frames"></span><input name="frames" type="number" min="15" max="60" value="24"></label>
        <details>
          <summary data-i18n="custom.heading"></summary>
          <div class="color-grid" id="planet-colors"></div>
        </details>
        <button class="primary" type="submit" data-i18n="common.generate"></button>
      </form>
      <div class="preview-area">
        <div class="preview-toolbar"><span id="planet-status" data-i18n="status.ready"></span><button id="planet-download" class="secondary" disabled data-i18n="common.download"></button></div>
        <div class="canvas-shell"><canvas id="planet-canvas" width="384" height="384"></canvas></div>
        <p id="planet-result" class="result"></p>
      </div>
    </section>

    <section id="galaxy-panel" class="generator-panel">
      <form id="galaxy-form" class="controls">
        <h2 data-i18n="galaxy.heading"></h2>
        <label><span data-i18n="common.mode"></span><select name="mode"><option value="static" data-i18n="mode.static"></option><option value="animation" data-i18n="mode.animation"></option></select></label>
        <label><span data-i18n="galaxy.theme"></span><select name="theme" id="galaxy-theme"></select></label>
        <div class="two-columns">
          <label><span data-i18n="galaxy.width"></span><input name="width" type="number" min="64" max="1024" step="16" value="256"></label>
          <label><span data-i18n="galaxy.height"></span><input name="height" type="number" min="64" max="1024" step="16" value="256"></label>
        </div>
        <label><span data-i18n="galaxy.starRatio"></span><select name="star-ratio"><option value="30">30%</option><option value="40">40%</option><option value="50">50%</option><option value="60" selected>60%</option><option value="70">70%</option><option value="80">80%</option><option value="90">90%</option></select></label>
        <fieldset class="seed-settings">
          <legend data-i18n="seed.heading"></legend>
          <label><span data-i18n="seed.source"></span><select name="seed-source"><option value="random" data-i18n="seed.random"></option><option value="input" data-i18n="seed.input"></option></select></label>
          <div class="seed-input-options" hidden>
            <label><span data-i18n="seed.policy"></span><select name="seed-policy"><option value="reproduce" data-i18n="seed.reproduce"></option><option value="avoid" data-i18n="seed.avoid"></option></select></label>
            <label><span data-i18n="seed.values"></span><input name="seeds" type="text" inputmode="numeric" data-i18n-placeholder="seed.placeholder"></label>
            <div class="seed-scan-options" hidden>
              <label class="check"><input name="scan-existing" type="checkbox"><span data-i18n="seed.scanExisting"></span></label>
              <div class="seed-folder-controls" hidden>
                <button name="choose-seed-folder" class="secondary" type="button" data-i18n="seed.chooseScanFolder"></button>
                <output class="seed-scan-status" data-i18n="seed.scanDefault"></output>
                <p class="seed-scan-help" data-i18n="seed.scanHelp"></p>
              </div>
            </div>
          </div>
        </fieldset>
        <label><span data-i18n="galaxy.seamless"></span><select name="seamless"><option value="none" data-i18n="seamless.none"></option><option value="horizontal" data-i18n="seamless.horizontal"></option><option value="vertical" data-i18n="seamless.vertical"></option><option value="both" data-i18n="seamless.both"></option></select></label>
        <label class="check"><input name="spiral" type="checkbox"><span data-i18n="galaxy.spiral"></span></label>
        <label class="animation-only"><span data-i18n="common.frames"></span><input name="frames" type="number" min="15" max="60" value="24"></label>
        <details>
          <summary data-i18n="custom.heading"></summary>
          <div class="color-grid" id="galaxy-colors"></div>
        </details>
        <button class="primary" type="submit" data-i18n="common.generate"></button>
      </form>
      <div class="preview-area">
        <div class="preview-toolbar"><span id="galaxy-status" data-i18n="status.ready"></span><button id="galaxy-download" class="secondary" disabled data-i18n="common.download"></button></div>
        <div class="canvas-shell galaxy"><canvas id="galaxy-canvas" width="512" height="512"></canvas></div>
        <p id="galaxy-result" class="result"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links">
      <a href="guide.html" data-i18n="nav.guide"></a><a href="faq.html" data-i18n="nav.faq"></a><a href="about.html" data-i18n="nav.about"></a><a href="privacy.html" data-i18n="nav.privacy"></a><a href="license.html" data-i18n="nav.license"></a>
    </nav>
  </footer>
  <script src="js/locales.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
